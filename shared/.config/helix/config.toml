theme = "github_light"

[keys.normal]
C-s = ":w"   # save
C-q = ":q!"  # quit (no save)

[keys.insert]
C-s = ["normal_mode", ":w"]
C-q = ["normal_mode", ":q!"]

[editor]
color-modes = true
cursorline = true
bufferline = "multiple"
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true

[editor.inline-diagnostics]
cursor-line = "disable"
other-lines = "hint"

[editor.statusline]
left = ["mode", "version-control"]
center = ["file-name", "read-only-indicator"]
right = ["diagnostics", "position", "file-type"]

[editor.whitespace.render]
space = "all"
nbsp = "all"
nnbsp = "all"
tab = "all"
tabpad = "all"
newline = "none"
