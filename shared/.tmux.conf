# Split panes with `ctrl+b v` (vertical, side by side) and `ctrl+b h` (horizontal, top and bottom)
bind-key -r v split-window -h
bind-key -r h split-window -v

# Status bar
set -g status on
set -g status-position bottom

# Enable mouse support (clickable panes, scroll)
set-option -g mouse on

# True color so the theme renders correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Catppuccin options
set -g @catppuccin_flavor 'latte' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_cpu_color "#{@thm_blue}"
set -g @catppuccin_ram_color "#{@thm_lavender}"
set -g @catppuccin_application_color "#{@thm_pink}"
set -g @catppuccin_session_color "#{?client_prefix,#{@thm_red},#{@thm_peach}}"

# CPU/RAM options
set -g @cpu_percentage_format "%4.1f%%"
set -g @ram_percentage_format "%4.1f%%"

# Status line modules
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""

# Initialize tpack
run 'tpack init'

# Status line modules (after tpack init so catppuccin is loaded for -F)
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Re-run tmux-cpu so it fills in the placeholders the CPU and RAM modules just added
run '~/.local/share/tmux/plugins/tmux-cpu-*/cpu.tmux'
