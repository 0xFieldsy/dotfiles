# Split panes with `ctrl+b |` (vertical, side by side) and `ctrl+b -` (horizontal, top and bottom)
bind-key -r | split-window -h
bind-key -r - split-window -v

# Pass Esc through immediately
set -sg escape-time 10

# Focus events
set -g focus-events on

# Mouse support
set -g mouse on

# Status bar
set -g status on
set -g status-position top

# True color so the theme renders correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Forward OSC 52 to the outer terminal
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

# Plugins
set -g @plugin 'catppuccin/tmux'

# Catppuccin options
set -g @catppuccin_flavor 'latte' # latte, frappe, macchiato, mocha
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'none'

# Status line
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g window-status-separator " "

# Initialize tpack
run 'tpack init'

# Style with Catppuccin colors
set -gF status-style "bg=default,fg=#{@thm_fg}"
set -g window-status-style 'default'
set -g window-status-current-style 'default'
set -g window-status-last-style 'default'
set -g window-status-activity-style 'default'
set -g window-status-bell-style 'default'
set -g window-status-format '#[fg=#{@thm_fg},bg=default] #I #[fg=#{@thm_subtext_1}]#W '
set -g window-status-current-format '#[fg=#{@thm_fg},bg=default,bold] #I #[fg=#{@thm_subtext_1}]#W#[nobold] '
set -g status-right '#[fg=#{@thm_blue},bg=default]#{@catppuccin_session_icon}#{session_name} '
